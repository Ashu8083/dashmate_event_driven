server:
  port : 8083
spring :
  datasource :
    url : jdbc:postgresql://localhost:5432/dashmate
    username : postgres
    password : root
  jpa :
    hibernate :
      ddl-auto : none
  flyway:
    enabled: true
    locations: classpath:db/migration
    
logging:
    level:
      org.flywaydb: DEBUG

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
  endpoint:
    health:
      show-details: always